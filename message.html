<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言板 · 浩然成长空间</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b66;
    --line: #e5e4df;
    --accent: #0f6e56;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  header { padding: 48px 0 28px; }
  .back { color: var(--accent); text-decoration: none; font-size: 14px; }
  h1 { font-size: 26px; font-weight: 600; margin-top: 12px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; margin-bottom: 40px; }
  .giscus { width: 100%; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="back" href="index.html">← 返回首页</a>

    </header>
    <div class="card">
      <div class="giscus"></div>
    </div>
  </div>
  <script src="https://giscus.app/client.js"
          data-repo="aichr9/chr9"
          data-repo-id="R_kgDOVk2TmA"

          data-category-id="DIC_kwDOVk2TmM4DKgRW"

          data-strict="0"

          data-theme="preferred_color_scheme"
          data-lang="zh-CN"
          crossorigin="anonymous"
          async>
  </script>
</body>
</html>
