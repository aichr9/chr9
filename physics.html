<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理教学 · 浩然成长空间</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b66;
    --line: #e5e4df;
    --accent: #0f6e56;
    --accent-soft: #e1f5ee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  header { padding: 48px 0 28px; }
  .back { color: var(--accent); text-decoration: none; font-size: 14px; }
  h1 { font-size: 26px; font-weight: 600; margin-top: 12px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }

  .posts { padding-bottom: 48px; }
  .post {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 22px;
    text-decoration: none;
    color: inherit;
    margin-bottom: 14px;
    transition: transform .12s ease, border-color .12s ease;
  }
  a.post:hover { transform: translateY(-2px); border-color: var(--accent); }
  .post-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .post h2 { font-size: 17px; font-weight: 600; }
  .post .state {
    font-size: 12px; padding: 1px 8px; border-radius: 999px;
    background: #f1efe8; color: #6b6b66; flex-shrink: 0;
  }
  .post p { font-size: 13px; color: var(--muted); }
  .post.pending { border-style: dashed; background: #fbfbf9; }

  .next { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 24px; }
  .next h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .next p { font-size: 13px; color: var(--muted); }
  footer { padding: 8px 0 48px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="back" href="index.html">← 返回首页</a>
      <h1>物理教学</h1>
      <p class="sub">不做题库搬运，只写学生反复卡住的地方</p>
    </header>

    <div class="posts">
      <div class="post pending">
        <div class="post-top">
          <h2>动量与动量定理</h2>
          <span class="state">整理中</span>
        </div>
        <p>从冲量到动量守恒，一条主线讲清楚，附板书与典型错解</p>
      </div>
    </div>

    <div class="next">
      <h3>接下来会写</h3>
      <p>按学生最容易栽跟头的地方来：受力分析的顺序、摩擦力的方向、能量与动量的选用边界、电路里的等效化简。</p>
    </div>

    <footer>
      <a href="index.html">浩然成长空间</a> · chr9.com
    </footer>
  </div>
</body>
</html>
