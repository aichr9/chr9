<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成长通识 · 浩然成长空间</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b66;
    --line: #e5e4df;
    --accent: #0f6e56;
    --accent-soft: #e1f5ee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  header { padding: 48px 0 28px; }
  .back { color: var(--accent); text-decoration: none; font-size: 14px; }
  h1 { font-size: 26px; font-weight: 600; margin-top: 12px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }

  .posts { padding-bottom: 48px; }
  .post {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 22px;
    text-decoration: none;
    color: inherit;
    margin-bottom: 14px;
    transition: transform .12s ease, border-color .12s ease;
  }
  a.post:hover { transform: translateY(-2px); border-color: var(--accent); }
  .post-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .post h2 { font-size: 17px; font-weight: 600; }
  .post .date { font-size: 12px; color: #b0afaa; flex-shrink: 0; }
  .post p { font-size: 13px; color: var(--muted); }

  .note {
    margin-top: 36px; border-top: 1px solid var(--line); padding-top: 24px;
  }
  .note h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .note p { font-size: 13px; color: var(--muted); }
  footer { padding: 8px 0 48px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="back" href="index.html">← 返回首页</a>
      <h1>成长通识</h1>
      <p class="sub">不是"我悟了"，是"我试了、这一步是怎么想的"</p>
    </header>

    <div class="posts">
      <a class="post" href="growth-01.html">
        <div class="post-top">
          <h2>一天，从「想要个主页」到「一个能长出内容的地方」</h2>
          <span class="date">2026-11-06</span>
        </div>
        <p>记今天搭网站的过程：卡住就换路、错了就砍。不是总结，是归档。</p>
      </a>
    </div>

    <div class="note">
      <h3>关于这个板块</h3>
      <p>这里是给自己的归档，顺便公开。写的是过程，不是结论——试错、取舍、想清楚一件事的经过。想清楚才写，宁缺毋滥。</p>
    </div>

    <footer>
      <a href="index.html">浩然成长空间</a> · chr9.com
    </footer>
  </div>
</body>
</html>
